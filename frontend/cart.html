<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SulE-Com | Cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="checkout-page">
  <header class="seller-header">
    <a class="brand-mark" href="index.html">SulE-Com</a>
    <nav class="seller-nav">
      <a href="home.html">Store</a>
      <a href="seller.html">Sell</a>
      <a href="checkout.html">Checkout</a>
      <a id="cartSignInLink" href="signin.html">Sign in</a>
      <button id="logoutBtn" class="logout-btn" type="button" hidden>Log out</button>
    </nav>
  </header>

  <main class="checkout-shell">
    <section class="cart-panel">
      <div class="panel-header">
        <div>
          <p class="mini-label">Your cart</p>
          <h1>Ready to checkout</h1>
        </div>
        <a href="home.html" class="secondary-link">Continue shopping</a>
      </div>

      <div id="cartItems" class="cart-list"></div>
    </section>

    <aside class="summary-panel">
      <h2>Order summary</h2>
      <div id="summaryRow" class="summary-row"><span>Items</span><strong id="summaryItems">0</strong></div>
      <div class="summary-row"><span>Subtotal</span><strong id="summarySubtotal">$0.00</strong></div>
      <div class="summary-row"><span>Shipping</span><strong>Free</strong></div>
      <div class="summary-row total"><span>Total</span><strong id="summaryTotal">$0.00</strong></div>
      <a href="checkout.html" class="primary-btn full-width">Proceed to checkout</a>
    </aside>
  </main>

  <script type="module">
    import { observeAuthState, signOutUser } from '/js/firebase-bundle.js';

    const cartItems = document.getElementById('cartItems');
    const summaryItems = document.getElementById('summaryItems');
    const summarySubtotal = document.getElementById('summarySubtotal');
    const summaryTotal = document.getElementById('summaryTotal');
    const cartSignInLink = document.getElementById('cartSignInLink');
    const logoutBtn = document.getElementById('logoutBtn');

    observeAuthState((user) => {
      cartSignInLink.hidden = Boolean(user);
      logoutBtn.hidden = !user;
    });

    logoutBtn.addEventListener('click', async () => {
      await signOutUser();
      window.location.href = 'index.html';
    });

    const renderCart = () => {
      const cart = JSON.parse(localStorage.getItem('sulecomCart') || '[]');

      if (!cart.length) {
        cartItems.innerHTML = '<div class="empty-state">Your cart is empty. Add items from the marketplace.</div>';
        summaryItems.textContent = '0';
        summarySubtotal.textContent = '$0.00';
        summaryTotal.textContent = '$0.00';
        return;
      }

      cartItems.replaceChildren();
      cart.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'cart-item';

        const left = document.createElement('div');
        const h3 = document.createElement('h3');
        h3.textContent = item.name;
        const p = document.createElement('p');
        p.textContent = 'Qty: 1';
        left.append(h3, p);

        const right = document.createElement('div');
        right.className = 'item-cost';
        const priceEl = document.createElement('strong');
        priceEl.textContent = `$${Number(item.price).toFixed(2)}`;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'remove-item-btn';
        btn.textContent = 'Remove';
        btn.addEventListener('click', () => {
          const updated = JSON.parse(localStorage.getItem('sulecomCart') || '[]');
          updated.splice(index, 1);
          localStorage.setItem('sulecomCart', JSON.stringify(updated));
          renderCart();
        });
        right.append(priceEl, btn);

        row.append(left, right);
        cartItems.append(row);
      });

      summaryItems.textContent = String(cart.length);
      const subtotal = cart.reduce((sum, item) => sum + Number(item.price || 0), 0);
      summarySubtotal.textContent = `$${subtotal.toFixed(2)}`;
      summaryTotal.textContent = `$${subtotal.toFixed(2)}`;
    };

    renderCart();
  </script>
</body>
</html>
