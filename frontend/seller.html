<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Sell an item | SulE-Com</title><link rel="stylesheet" href="style.css" /></head>
<body class="seller-page"><header class="seller-header"><a class="brand-mark" href="home.html">SulE-Com</a><nav class="seller-nav"><a href="home.html">Store</a><a href="cart.html">Cart</a><button id="logoutBtn" class="logout-btn" type="button">Log out</button></nav></header>
<main class="seller-shell"><section class="seller-panel"><div class="panel-header"><div><p class="mini-label">Seller hub</p><h1>List a new item</h1></div><a href="home.html" class="secondary-link">Back to storefront</a></div>
<form id="productForm" class="product-form"><div class="field-row"><label for="productName">Product name</label><input type="text" id="productName" name="productName" maxlength="120" required /></div><div class="field-row two-col"><div><label for="productPrice">Price</label><input type="number" id="productPrice" name="productPrice" min="0.01" step="0.01" required /></div><div><label for="productCategory">Category</label><input type="text" id="productCategory" name="productCategory" maxlength="80" required /></div></div><div class="field-row"><label for="productImage">Image URL (optional)</label><input type="url" id="productImage" name="productImage" /></div><div class="field-row"><label for="productDescription">Description</label><textarea id="productDescription" name="productDescription" rows="5" maxlength="2000" required></textarea></div><button type="submit" class="auth-btn primary">Publish item</button></form><p id="sellerMessage" class="auth-message" aria-live="polite"></p>
</section></main>
<script>
const form = document.getElementById('productForm'); const message = document.getElementById('sellerMessage');
(async () => { try { const response = await fetch('/api/session'); if (!response.ok) { location.href = 'signin.html'; return; } const data = await response.json(); if (data.user.accountType !== 'buyer-seller') { message.textContent = 'Buy-only accounts cannot publish products.'; message.className = 'auth-message error'; form.querySelector('button').disabled = true; } } catch (_error) { location.href = 'signin.html'; } })();
form.addEventListener('submit', async (event) => { event.preventDefault(); try { const response = await fetch('/api/products', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ name: form.elements.productName.value, price: form.elements.productPrice.value, category: form.elements.productCategory.value, description: form.elements.productDescription.value, image: form.elements.productImage.value }) }); const result = await response.json(); message.textContent = result.message || 'Product saved.'; message.className = `auth-message ${response.ok ? 'success' : 'error'}`; if (response.ok) form.reset(); } catch (_error) { message.textContent = 'Product could not be uploaded right now.'; message.className = 'auth-message error'; } });
document.getElementById('logoutBtn').addEventListener('click', async () => { await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }).catch(() => {}); location.href = 'signin.html'; });
</script></body></html>
