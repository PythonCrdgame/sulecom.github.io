<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SulE-Com | Seller Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="seller-page">
  <header class="seller-header">
    <a class="brand-mark" href="home.html">SulE-Com</a>
    <nav class="seller-nav">
      <a href="home.html">Store</a>
      <a href="checkout.html">Cart</a>
      <button id="logoutBtn" class="logout-btn" type="button">Log out</button>
    </nav>
  </header>

  <main class="seller-shell">
    <section class="seller-panel">
      <div class="panel-header">
        <div>
          <p class="mini-label">Seller hub</p>
          <h1>List a new item</h1>
        </div>
        <a href="home.html" class="secondary-link">Back to storefront</a>
      </div>

      <form id="productForm" class="product-form">
        <div class="field-row"><label for="productName">Product name</label><input type="text" id="productName" name="productName" maxlength="120" required /></div>
        <div class="field-row two-col">
          <div><label for="productPrice">Price</label><input type="number" id="productPrice" name="productPrice" min="0.01" step="0.01" required /></div>
          <div><label for="productCategory">Category</label><input type="text" id="productCategory" name="productCategory" maxlength="80" required /></div>
        </div>
        <div class="field-row two-col">
          <div><label for="productStock">Stock available</label><input type="number" id="productStock" name="productStock" min="1" step="1" value="10" required /></div>
          <div><label for="productMaxQuantity">Max per customer</label><input type="number" id="productMaxQuantity" name="productMaxQuantity" min="1" step="1" value="2" required /></div>
        </div>
        <div class="field-row"><label for="productImage">Image URL (optional)</label><input type="url" id="productImage" name="productImage" /></div>
        <div class="field-row"><label for="productDescription">Description</label><textarea id="productDescription" name="productDescription" rows="5" maxlength="2000" required></textarea></div>
        <button type="submit" class="auth-btn primary">Publish item</button>
      </form>
      <p id="sellerMessage" class="auth-message" aria-live="polite"></p>
    </section>
  </main>

  <script>
    const form = document.getElementById('productForm');
    const message = document.getElementById('sellerMessage');

    const requireSession = async () => {
      try {
        const response = await fetch('/api/session', { credentials: 'same-origin' });
        const data = await response.json().catch(() => ({}));

        if (!response.ok || !data.user) {
          window.location.href = 'signin.html';
          return null;
        }

        if (data.user.accountType !== 'buyer-seller') {
          message.textContent = 'Buy-only accounts cannot publish products.';
          message.className = 'auth-message error';
          form.querySelector('button').disabled = true;
        }

        return data.user;
      } catch (_error) {
        window.location.href = 'signin.html';
        return null;
      }
    };

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;

      try {
        const payload = {
          name: form.elements.productName.value,
          price: form.elements.productPrice.value,
          category: form.elements.productCategory.value,
          description: form.elements.productDescription.value,
          image: form.elements.productImage.value,
          stock: form.elements.productStock.value,
          maxQuantity: form.elements.productMaxQuantity.value,
        };

        const response = await fetch('/api/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(payload),
        });

        const result = await response.json().catch(() => ({}));
        message.textContent = result.message || 'Product saved.';
        message.className = `auth-message ${response.ok ? 'success' : 'error'}`;

        if (response.ok) {
          form.reset();
          form.elements.productStock.value = '10';
          form.elements.productMaxQuantity.value = '2';
        }
      } catch (_error) {
        message.textContent = 'Product could not be uploaded right now.';
        message.className = 'auth-message error';
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }).catch(() => {});
      window.location.href = 'signin.html';
    });

    requireSession();
  </script>
</body>
</html>
