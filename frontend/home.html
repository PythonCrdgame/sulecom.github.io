<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SulE-Com | Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="store-body">
  <header class="store-header">
    <div class="store-topbar">
      <a class="brand-mark" href="index.html">SulE-Com</a>
      <div class="store-search">
        <input id="searchInput" type="search" placeholder="Search products" aria-label="Search products" />
        <button id="searchBtn" type="button">Search</button>
      </div>
      <nav class="store-actions">
        <a href="index.html">Home</a>
        <a href="seller.html">Sell</a>
        <a href="cart.html">Cart <span id="cartCount">0</span></a>
        <span id="accountLinks"><a href="signin.html">Sign in</a> <a href="signup.html">Create account</a></span>
        <button id="logoutBtn" class="logout-btn" type="button" hidden>Log out</button>
      </nav>
    </div>
    <nav class="store-nav" id="storeNav">
      <span data-category="All" class="active">All</span>
      <span data-category="Electronics">Electronics</span>
      <span data-category="Home">Home</span>
      <span data-category="Fashion">Fashion</span>
      <span data-category="Books">Books</span>
      <span data-category="Deals">Deals</span>
    </nav>
  </header>
  <main class="store-main">
    <section class="welcome-strip">
      <div>
        <p class="mini-label">Marketplace</p>
        <h1>Shop SulE-Com</h1>
      </div>
      <div class="welcome-summary">
        <span id="accountBadge" hidden>Buyer account</span>
        <span id="welcomeName">Browse products from local sellers</span>
      </div>
    </section>
    <section class="products-toolbar">
      <div class="section-tag">Popular products</div>
      <a href="seller.html" class="secondary-link">Sell an item</a>
    </section>
    <section id="productGrid" class="product-grid store-product-grid" aria-live="polite"></section>
  </main>
  <script type="module">
    import {
      observeAuthState,
      ensureUserDocuments,
      signOutUser,
      fetchActiveProducts,
      subscribeActiveProducts,
    } from '/js/firebase-bundle.js';

    const grid = document.getElementById('productGrid');
    const accountLinks = document.getElementById('accountLinks');
    const logoutBtn = document.getElementById('logoutBtn');
    const accountBadge = document.getElementById('accountBadge');
    const welcomeName = document.getElementById('welcomeName');
    const cartCount = document.getElementById('cartCount');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const storeNav = document.getElementById('storeNav');

    const params = new URLSearchParams(window.location.search);
    let activeCategory = params.get('category') || 'All';
    let searchQuery = (params.get('q') || '').trim().toLowerCase();
    searchInput.value = params.get('q') || '';

    let firestoreProducts = [];
    let starterProducts = [];
    let unsubscribeProducts = null;

    const safeCart = () => {
      try {
        const cart = JSON.parse(localStorage.getItem('sulecomCart') || '[]');
        return Array.isArray(cart) ? cart : [];
      } catch (_error) {
        return [];
      }
    };

    const updateCartCount = () => {
      cartCount.textContent = String(safeCart().length);
    };

    const loadStarterCatalog = async () => {
      try {
        const response = await fetch('/api/products');
        if (!response.ok) return [];
        const rows = await response.json();
        return Array.isArray(rows)
          ? rows.map((p) => ({
              id: `starter_${p.id}`,
              name: p.name,
              price: Number(p.price),
              category: p.category,
              description: p.description,
              image: p.image,
            }))
          : [];
      } catch (_error) {
        return [];
      }
    };

    const renderProducts = () => {
      const combined = firestoreProducts.length > 0 ? [...firestoreProducts, ...starterProducts] : starterProducts;
      const filtered = combined.filter((product) => {
        const matchesCat = activeCategory === 'All' || product.category === activeCategory;
        const matchesSearch =
          !searchQuery ||
          String(product.name || '').toLowerCase().includes(searchQuery) ||
          String(product.description || '').toLowerCase().includes(searchQuery) ||
          String(product.category || '').toLowerCase().includes(searchQuery);
        return matchesCat && matchesSearch;
      });

      grid.replaceChildren();
      if (!filtered.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No matching products found.';
        grid.append(empty);
        return;
      }

      filtered.forEach((product) => {
        const card = document.createElement('article');
        card.className = 'product-card';

        const image = document.createElement('img');
        image.src =
          product.image ||
          'https://images.unsplash.com/photo-1524758631624-e2822e304c36?auto=format&fit=crop&w=900&q=80';
        image.alt = product.name || 'Product';
        image.loading = 'lazy';

        const body = document.createElement('div');
        body.className = 'product-body';

        const badge = document.createElement('span');
        badge.className = 'product-badge';
        badge.textContent = product.category || 'Other';

        const title = document.createElement('h3');
        title.textContent = product.name || '';

        const description = document.createElement('p');
        description.textContent = product.description || '';

        const meta = document.createElement('div');
        meta.className = 'product-meta';

        const price = document.createElement('strong');
        price.textContent = `$${Number(product.price).toFixed(2)}`;

        const add = document.createElement('button');
        add.type = 'button';
        add.className = 'add-cart-btn';
        add.textContent = 'Add to Cart';
        add.addEventListener('click', () => {
          const cart = safeCart();
          cart.push({
            productId: String(product.id),
            name: product.name,
            price: Number(product.price),
          });
          localStorage.setItem('sulecomCart', JSON.stringify(cart));
          updateCartCount();
          add.textContent = 'Added';
        });

        meta.append(price, add);
        body.append(badge, title, description, meta);
        card.append(image, body);
        grid.append(card);
      });
    };

    const setCategoryUI = () => {
      storeNav.querySelectorAll('span[data-category]').forEach((el) => {
        el.classList.toggle('active', el.dataset.category === activeCategory);
      });
    };

    storeNav.querySelectorAll('span[data-category]').forEach((el) => {
      el.addEventListener('click', () => {
        activeCategory = el.dataset.category || 'All';
        setCategoryUI();
        renderProducts();
      });
    });

    const applySearch = () => {
      searchQuery = searchInput.value.trim().toLowerCase();
      renderProducts();
    };
    searchBtn.addEventListener('click', applySearch);
    searchInput.addEventListener('input', applySearch);

    logoutBtn.addEventListener('click', async () => {
      await signOutUser();
      window.location.href = 'index.html';
    });

    observeAuthState(async (user) => {
      if (unsubscribeProducts) {
        unsubscribeProducts();
        unsubscribeProducts = null;
      }

      if (user) {
        accountLinks.hidden = true;
        logoutBtn.hidden = false;
        accountBadge.hidden = false;
        try {
          const profile = await ensureUserDocuments(user);
          welcomeName.textContent = `Welcome, ${profile.displayName}`;
          accountBadge.textContent =
            profile.accountType === 'buyer' ? 'Buy Only account' : 'Buy & Sell account';
        } catch (_err) {
          welcomeName.textContent = `Welcome, ${user.displayName || user.email || 'Shopper'}`;
        }

        unsubscribeProducts = subscribeActiveProducts(
          (items) => {
            firestoreProducts = items;
            renderProducts();
          },
          () => {
            renderProducts();
          }
        );
      } else {
        accountLinks.hidden = false;
        logoutBtn.hidden = true;
        accountBadge.hidden = true;
        welcomeName.textContent = 'Browse products from local sellers';
        try {
          firestoreProducts = await fetchActiveProducts();
        } catch (_err) {
          firestoreProducts = [];
        }
        renderProducts();
      }
    });

    updateCartCount();
    setCategoryUI();
    loadStarterCatalog().then((items) => {
      starterProducts = items;
      renderProducts();
    });
  </script>
</body>
</html>
