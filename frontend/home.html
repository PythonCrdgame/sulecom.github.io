<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SulE-Com | Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="store-body">
  <header class="store-header">
    <div class="store-topbar">
      <a class="brand-mark" href="/">SulE-Com</a>
      <div class="store-search"><input type="search" placeholder="Search products" aria-label="Search products" /><button type="button">Search</button></div>
      <nav class="store-actions"><a href="/">Home</a><a href="seller.html">Sell</a><a href="cart.html">Cart <span id="cartCount">0</span></a><span id="accountLinks"><a href="signin.html">Sign in</a> <a href="signup.html">Create account</a></span><button id="logoutBtn" class="logout-btn" type="button" hidden>Log out</button></nav>
    </div>
    <nav class="store-nav"><span>All</span><span>Best Sellers</span><span>Electronics</span><span>Home</span><span>Fashion</span><span>Deals</span></nav>
  </header>
  <main class="store-main">
    <section class="welcome-strip"><div><p class="mini-label">Marketplace</p><h1>Shop SulE-Com</h1></div><div class="welcome-summary"><span id="welcomeName">Browse products from local sellers</span></div></section>
    <section class="products-toolbar"><div class="section-tag">Popular products</div><a href="seller.html" class="secondary-link">Sell an item</a></section>
    <section id="productGrid" class="product-grid store-product-grid" aria-live="polite"></section>
  </main>
  <script>
    const grid = document.getElementById('productGrid');
    const accountLinks = document.getElementById('accountLinks');
    const logoutBtn = document.getElementById('logoutBtn');
    const cartCount = document.getElementById('cartCount');
    const safeCart = () => { try { const cart = JSON.parse(localStorage.getItem('sulecomCart') || '[]'); return Array.isArray(cart) ? cart : []; } catch (_error) { return []; } };
    const updateCartCount = () => { cartCount.textContent = safeCart().length; };
    const renderProducts = async () => {
      try {
        const response = await fetch('/api/products');
        if (!response.ok) throw new Error('Products unavailable');
        const products = await response.json();
        grid.replaceChildren();
        products.forEach((product) => {
          const card = document.createElement('article'); card.className = 'product-card';
          const image = document.createElement('img'); image.src = product.image || ''; image.alt = product.name || 'Product'; image.loading = 'lazy';
          const body = document.createElement('div'); body.className = 'product-body';
          const badge = document.createElement('span'); badge.className = 'product-badge'; badge.textContent = product.category || '';
          const title = document.createElement('h3'); title.textContent = product.name || '';
          const description = document.createElement('p'); description.textContent = product.description || '';
          const meta = document.createElement('div'); meta.className = 'product-meta';
          const price = document.createElement('strong'); price.textContent = `$${Number(product.price).toFixed(2)}`;
          const add = document.createElement('button'); add.type = 'button'; add.className = 'add-cart-btn'; add.textContent = 'Add to Cart';
          add.addEventListener('click', () => { const cart = safeCart(); cart.push({ productId: product.id, name: product.name, price: Number(product.price) }); localStorage.setItem('sulecomCart', JSON.stringify(cart)); updateCartCount(); add.textContent = 'Added'; });
          meta.append(price, add); body.append(badge, title, description, meta); card.append(image, body); grid.append(card);
        });
        if (!products.length) grid.textContent = 'No products are listed yet.';
      } catch (_error) { grid.textContent = 'Unable to load products. Make sure the SulE-Com backend is deployed and running.'; }
    };
    fetch('/api/session').then((response) => response.ok ? response.json() : null).then((data) => {
      if (data && data.user) { document.getElementById('welcomeName').textContent = `Welcome, ${data.user.name}`; accountLinks.hidden = true; logoutBtn.hidden = false; }
    }).catch(() => {});
    logoutBtn.addEventListener('click', async () => { await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }).catch(() => {}); localStorage.removeItem('sulecomUser'); window.location.href = '/'; });
    updateCartCount(); renderProducts();
  </script>
</body>
</html>
