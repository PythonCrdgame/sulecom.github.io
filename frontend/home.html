<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SulE-Com | Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="store-body">
  <header class="store-header">
    <div class="store-topbar">
      <div class="brand-mark">SulE-Com</div>
      <div class="store-search">
        <input type="text" placeholder="Search for products, brands, and more" />
        <button type="button">Search</button>
      </div>
      <div class="store-actions">
        <a href="index.html">Home</a>
        <a href="seller.html">Sell</a>
        <a href="checkout.html">Cart <span id="cartCount">0</span></a>
        <button id="logoutBtn" class="logout-btn" type="button">Log out</button>
      </div>
    </div>
    <nav class="store-nav">
      <span>All</span>
      <span>Best Sellers</span>
      <span>Electronics</span>
      <span>Home</span>
      <span>Fashion</span>
      <span>Books</span>
      <span>Prime</span>
      <span>Deals</span>
    </nav>
  </header>

  <main class="store-main">
    <section class="welcome-strip">
      <div>
        <p class="mini-label">Welcome back</p>
        <h1>Hello, <span id="welcomeName">Shopper</span></h1>
      </div>
      <div class="welcome-summary">
        <span id="accountBadge">Buyer account</span>
        <strong id="welcomeEmail">No email</strong>
      </div>
    </section>

    <section class="products-toolbar">
      <div class="section-tag">Marketplace</div>
      <a href="seller.html" class="secondary-link">Sell an item</a>
    </section>

    <section id="productGrid" class="product-grid store-product-grid" aria-live="polite"></section>
  </main>

  <script>
    const productGrid = document.getElementById('productGrid');
    const welcomeName = document.getElementById('welcomeName');
    const welcomeEmail = document.getElementById('welcomeEmail');
    const accountBadge = document.getElementById('accountBadge');
    const cartCount = document.getElementById('cartCount');
    const logoutBtn = document.getElementById('logoutBtn');

    const safeCart = () => {
      try {
        const cart = JSON.parse(localStorage.getItem('sulecomCart') || '[]');
        return Array.isArray(cart) ? cart : [];
      } catch (_error) {
        return [];
      }
    };

    const updateCartCount = () => {
      const cart = safeCart();
      cartCount.textContent = String(cart.reduce((sum, item) => sum + (Number(item.quantity) || 1), 0));
    };

    const requireSession = async () => {
      try {
        const response = await fetch('/api/session', { credentials: 'same-origin' });
        const data = await response.json().catch(() => ({}));

        if (!response.ok || !data.user) {
          localStorage.removeItem('sulecomUser');
          window.location.href = 'signin.html';
          return null;
        }

        localStorage.setItem('sulecomUser', JSON.stringify(data.user));
        return data.user;
      } catch (_error) {
        localStorage.removeItem('sulecomUser');
        window.location.href = 'signin.html';
        return null;
      }
    };

    const addToCart = (product) => {
      const cart = safeCart();
      const maxQty = Math.max(1, Number(product.maxQuantity || product.max_quantity || product.stock || 1));
      const existing = cart.findIndex((item) => item.productId === product.id);

      if (existing >= 0) {
        const currentQty = Number(cart[existing].quantity || 1);
        cart[existing].quantity = Math.min(currentQty + 1, maxQty);
      } else {
        cart.push({
          productId: product.id,
          name: product.name,
          price: Number(product.price),
          quantity: 1,
          maxQuantity: maxQty,
          stock: Number(product.stock || maxQty),
        });
      }

      localStorage.setItem('sulecomCart', JSON.stringify(cart));
      updateCartCount();
    };

    const renderProducts = async () => {
      try {
        const response = await fetch('/api/products');
        if (!response.ok) throw new Error('Products unavailable');

        const products = await response.json();
        productGrid.innerHTML = products.map((product) => {
          const maxQty = Math.max(1, Number(product.maxQuantity || product.max_quantity || product.stock || 1));
          const stock = Math.max(1, Number(product.stock || maxQty));
          return `
            <article class="product-card" data-name="${product.name}" data-price="${product.price}">
              <img src="${product.image || 'https://images.unsplash.com/photo-1524758631624-e2822e304c36?auto=format&fit=crop&w=900&q=80'}" alt="${product.name}" />
              <div class="product-body">
                <span class="product-badge">${product.category}</span>
                <h3>${product.name}</h3>
                <p>${product.description}</p>
                <div class="product-meta">
                  <strong>$${Number(product.price).toFixed(2)}</strong>
                  <span class="stock-meta">${stock} left · Max ${maxQty} each</span>
                </div>
                <button class="add-cart-btn" type="button" data-product-id="${product.id}" data-product-name="${product.name}" data-product-price="${product.price}" data-product-max="${maxQty}" data-product-stock="${stock}">Add to Cart</button>
              </div>
            </article>
          `;
        }).join('');

        document.querySelectorAll('.add-cart-btn').forEach((button) => {
          button.addEventListener('click', () => {
            const product = {
              id: Number(button.dataset.productId),
              name: button.dataset.productName,
              price: Number(button.dataset.productPrice),
              maxQuantity: Number(button.dataset.productMax || 1),
              stock: Number(button.dataset.productStock || 1),
            };
            addToCart(product);
            button.textContent = 'Added';
            button.disabled = true;
            setTimeout(() => {
              button.textContent = 'Add to Cart';
              button.disabled = false;
            }, 700);
          });
        });
      } catch (_error) {
        productGrid.innerHTML = '<div class="empty-state">Unable to load products right now. Please try again.</div>';
      }
    };

    logoutBtn.addEventListener('click', async () => {
      try {
        await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
      } catch (_error) {
        // no-op
      }

      localStorage.removeItem('sulecomUser');
      localStorage.removeItem('sulecomCart');
      window.location.href = 'signin.html';
    });

    (async () => {
      const user = await requireSession();
      if (!user) return;

      welcomeName.textContent = user.name || 'Shopper';
      welcomeEmail.textContent = user.email || 'No email';
      accountBadge.textContent = user.accountType === 'buyer' ? 'Buy Only account' : 'Buy & Sell account';
      updateCartCount();
      renderProducts();
    })();
  </script>
</body>
</html>
