<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SulE-Com | Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="store-body">
  <header class="store-header">
    <div class="store-topbar">
      <div class="brand-mark">SulE-Com</div>
      <div class="store-search">
        <input type="text" placeholder="Search for products, brands, and more" />
        <button>Search</button>
      </div>
      <div class="store-actions">
        <a href="index.html">Home</a>
        <a href="seller.html">Sell</a>
        <a href="cart.html">Cart <span id="cartCount">0</span></a>
        <button id="logoutBtn" class="logout-btn" type="button">Log out</button>
      </div>
    </div>
    <nav class="store-nav">
      <span>All</span>
      <span>Best Sellers</span>
      <span>Electronics</span>
      <span>Home</span>
      <span>Fashion</span>
      <span>Books</span>
      <span>Prime</span>
      <span>Deals</span>
    </nav>
  </header>

  <main class="store-main">
    <section class="welcome-strip">
      <div>
        <p class="mini-label">Welcome back</p>
        <h1>Hello, <span id="welcomeName">Shopper</span></h1>
      </div>
      <div class="welcome-summary">
        <span id="accountBadge">Buyer account</span>
        <strong id="welcomeEmail">No email</strong>
      </div>
    </section>

    <section class="products-toolbar">
      <div class="section-tag">Marketplace</div>
      <a href="seller.html" class="secondary-link">Sell an item</a>
    </section>

    <section id="productGrid" class="product-grid store-product-grid"></section>
  </main>

  <script>
    const productGrid = document.getElementById('productGrid');
    const welcomeName = document.getElementById('welcomeName');
    const welcomeEmail = document.getElementById('welcomeEmail');
    const accountBadge = document.getElementById('accountBadge');
    const cartCount = document.getElementById('cartCount');
    const logoutBtn = document.getElementById('logoutBtn');

    const storedUser = JSON.parse(localStorage.getItem('sulecomUser') || 'null');
    if (!storedUser) {
      window.location.href = 'signin.html';
    } else {
      welcomeName.textContent = storedUser.name || 'Shopper';
      welcomeEmail.textContent = storedUser.email || 'No email';
      accountBadge.textContent = storedUser.accountType === 'buyer' ? 'Buy Only account' : 'Buy & Sell account';
    }

    const updateCartCount = () => {
      const cart = JSON.parse(localStorage.getItem('sulecomCart') || '[]');
      cartCount.textContent = cart.length;
    };

    const renderProducts = async () => {
      try {
        const response = await fetch('/api/products');
        const products = await response.json();

        productGrid.innerHTML = products.map((product) => `
          <article class="product-card" data-name="${product.name}" data-price="${product.price}">
            <img src="${product.image || 'https://images.unsplash.com/photo-1524758631624-e2822e304c36?auto=format&fit=crop&w=900&q=80'}" alt="${product.name}" />
            <div class="product-body">
              <span class="product-badge">${product.category}</span>
              <h3>${product.name}</h3>
              <p>${product.description}</p>
              <div class="product-meta">
                <strong>$${Number(product.price).toFixed(2)}</strong>
                <button class="add-cart-btn" type="button">Add to Cart</button>
              </div>
            </div>
          </article>
        `).join('');

        document.querySelectorAll('.add-cart-btn').forEach((button) => {
          button.addEventListener('click', () => {
            const card = button.closest('.product-card');
            const cart = JSON.parse(localStorage.getItem('sulecomCart') || '[]');
            cart.push({ name: card.dataset.name, price: Number(card.dataset.price) });
            localStorage.setItem('sulecomCart', JSON.stringify(cart));
            updateCartCount();
            button.textContent = 'Added';
            button.disabled = true;
          });
        });
      } catch (error) {
        productGrid.innerHTML = '<div class="empty-state">Unable to load products right now.</div>';
      }
    };

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('sulecomUser');
      localStorage.removeItem('sulecomCart');
      window.location.href = 'signin.html';
    });

    updateCartCount();
    renderProducts();
  </script>
</body>
</html>
