<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | SulE-Com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <div class="auth-shell">
    <aside class="auth-brand-panel">
      <div class="brand-mark">SulE-Com</div>
      <h1>Welcome back to your marketplace.</h1>
      <p>Sign in to keep shopping, track your orders, and manage your saved deals.</p>
      <ul>
        <li>Personalized shopping</li>
        <li>Saved favorites</li>
        <li>Fast checkout</li>
      </ul>
    </aside>

    <main class="auth-panel">
      <div class="auth-topbar">
        <span class="mini-label">Sign in</span>
        <a href="index.html">Back to store</a>
      </div>

      <h2>Welcome back</h2>

      <form id="signinForm" class="auth-form">
        <div class="field-row">
          <label for="signin-email">Email address</label>
          <input type="email" id="signin-email" name="email" placeholder="you@example.com" required />
        </div>

        <div class="field-row">
          <label for="signin-password">Password</label>
          <input type="password" id="signin-password" name="password" placeholder="Enter your password" required />
        </div>

        <button type="submit" class="auth-btn primary">Sign in</button>
      </form>

      <p id="signinMessage" class="auth-message"></p>

      <p class="auth-switch">
        Need an account? <a href="signup.html">Create one</a>
      </p>
    </main>
  </div>

  <script>
    const signinForm = document.getElementById('signinForm');
    const signinMessage = document.getElementById('signinMessage');

    const redirectIfLoggedIn = async () => {
      try {
        const response = await fetch('/api/session', { credentials: 'same-origin' });
        if (response.ok) {
          window.location.href = 'home.html';
        }
      } catch (error) {
        // no-op
      }
    };

    signinForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = {
        email: signinForm.email.value,
        password: signinForm.password.value,
      };

      try {
        const response = await fetch('/api/signin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(payload),
        });

        const result = await response.json();
        signinMessage.textContent = result.message || 'Login processed.';
        signinMessage.className = 'auth-message ' + (response.ok ? 'success' : 'error');

        if (response.ok) {
          signinForm.reset();
          localStorage.setItem('sulecomUser', JSON.stringify(result.user));
          window.location.href = 'home.html';
        }
      } catch (error) {
        signinMessage.textContent = 'Unable to sign in right now.';
        signinMessage.className = 'auth-message error';
      }
    });

    redirectIfLoggedIn();
  </script>
</body>
</html>
