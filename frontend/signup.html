<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@100;300;400;700&display=swap" rel="stylesheet">
    <title>Sign-Up | SulE-Com</title>
</head>
<body class="auth-body">
    <main class="auth-card">
        <h1>Create your SulE-Com account</h1>
        <p>Choose the account that matches how you want to use the marketplace.</p>

        <form id="signupForm">
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" placeholder="Jane Doe" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required>

            <div class="account-type-group">
                <h2>Account type</h2>
                <label class="radio-option">
                    <input type="radio" name="accountType" value="buyer-seller" checked>
                    <span>Buy & Sell</span>
                </label>
                <label class="radio-option">
                    <input type="radio" name="accountType" value="buyer">
                    <span>Buy Only</span>
                </label>
            </div>

            <button type="submit">Create account</button>
        </form>

        <p id="signupMessage" class="message"></p>
        <p class="switch-link">Already have an account? <a href="signin.html">Sign in</a></p>
    </main>

    <script>
        const signupForm = document.getElementById('signupForm');
        const signupMessage = document.getElementById('signupMessage');

        signupForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const payload = {
                name: signupForm.name.value,
                email: signupForm.email.value,
                password: signupForm.password.value,
                accountType: signupForm.accountType.value,
            };

            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                const result = await response.json();
                signupMessage.textContent = result.message || 'Account processed.';
                signupMessage.classList.add(response.ok ? 'success' : 'error');
                signupMessage.classList.remove(response.ok ? 'error' : 'success');

                if (response.ok) {
                    signupForm.reset();
                    localStorage.setItem('sulecomUser', JSON.stringify(result.user));
                    window.location.href = 'home.html';
                }
            } catch (error) {
                signupMessage.textContent = 'Something went wrong. Please try again.';
                signupMessage.classList.add('error');
            }
        });
    </script>
</body>
</html>
