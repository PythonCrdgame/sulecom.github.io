<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SulE-Com | Seller Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="seller-page">
  <header class="seller-header">
    <div class="brand-mark">SulE-Com</div>
    <nav class="seller-nav">
      <a href="home.html">Store</a>
      <a href="cart.html">Cart</a>
      <a href="checkout.html">Checkout</a>
      <button id="logoutBtn" class="logout-btn" type="button">Log out</button>
    </nav>
  </header>

  <main class="seller-shell">
    <section class="seller-panel">
      <div class="panel-header">
        <div>
          <p class="mini-label">Seller hub</p>
          <h1>List a new item</h1>
        </div>
        <a href="home.html" class="secondary-link">Back to storefront</a>
      </div>

      <form id="productForm" class="product-form">
        <div class="field-row">
          <label for="productName">Product name</label>
          <input type="text" id="productName" name="productName" placeholder="Example: Bluetooth Speaker" required />
        </div>

        <div class="field-row two-col">
          <div>
            <label for="productPrice">Price</label>
            <input type="number" id="productPrice" name="productPrice" min="0" step="0.01" placeholder="49.99" required />
          </div>
          <div>
            <label for="productCategory">Category</label>
            <input type="text" id="productCategory" name="productCategory" placeholder="Electronics" required />
          </div>
        </div>

        <div class="field-row">
          <label for="productImage">Image URL</label>
          <input type="url" id="productImage" name="productImage" placeholder="https://example.com/image.jpg" />
        </div>

        <div class="field-row">
          <label for="productDescription">Description</label>
          <textarea id="productDescription" name="productDescription" rows="5" placeholder="Describe your product" required></textarea>
        </div>

        <button type="submit" class="auth-btn primary">Publish item</button>
      </form>

      <p id="sellerMessage" class="auth-message"></p>
    </section>
  </main>

  <script>
    const logoutBtn = document.getElementById('logoutBtn');
    const productForm = document.getElementById('productForm');
    const sellerMessage = document.getElementById('sellerMessage');

    const requireSession = async () => {
      try {
        const response = await fetch('/api/session', { credentials: 'same-origin' });
        const data = await response.json().catch(() => ({}));

        if (!response.ok || !data.user) {
          localStorage.removeItem('sulecomUser');
          window.location.href = 'signin.html';
          return null;
        }

        localStorage.setItem('sulecomUser', JSON.stringify(data.user));
        return data.user;
      } catch (error) {
        localStorage.removeItem('sulecomUser');
        window.location.href = 'signin.html';
        return null;
      }
    };

    (async () => {
      const user = await requireSession();
      if (!user) return;

      if (user.accountType !== 'buyer-seller') {
        sellerMessage.textContent = 'Buy-only accounts cannot publish products.';
        sellerMessage.className = 'auth-message error';
        productForm.querySelector('button').disabled = true;
      }
    })();

    productForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const user = JSON.parse(localStorage.getItem('sulecomUser') || 'null');
      if (!user) {
        window.location.href = 'signin.html';
        return;
      }

      const payload = {
        name: productForm.productName.value,
        price: productForm.productPrice.value,
        category: productForm.productCategory.value,
        description: productForm.productDescription.value,
        image: productForm.productImage.value,
      };

      try {
        const response = await fetch('/api/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(payload),
        });

        const result = await response.json();
        sellerMessage.textContent = result.message || 'Product saved.';
        sellerMessage.className = 'auth-message ' + (response.ok ? 'success' : 'error');

        if (response.ok) {
          productForm.reset();
        }
      } catch (error) {
        sellerMessage.textContent = 'Product could not be uploaded right now.';
        sellerMessage.className = 'auth-message error';
      }
    });

    logoutBtn.addEventListener('click', async () => {
      try {
        await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
      } catch (error) {
        // no-op
      }

      localStorage.removeItem('sulecomUser');
      localStorage.removeItem('sulecomCart');
      window.location.href = 'signin.html';
    });
  </script>
</body>
</html>
